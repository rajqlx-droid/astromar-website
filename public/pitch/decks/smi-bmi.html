<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astromar SMI and BMI</title><meta name="robots" content="noindex,nofollow">
<style>
:root{--letter:#E6EBF3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--letter:#0F1A2E}}
:root[data-theme="dark"]{--letter:#0F1A2E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--letter);font-family:Arial,Helvetica,sans-serif}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#F4F6FA;color:#14284B;overflow:hidden}
#band{height:240px;background:#1B3A6B;display:flex;justify-content:space-between;align-items:center;padding:3px 96px 0;box-sizing:border-box} #sub:empty{display:none}
#band .bar{width:84px;height:8px;background:#F97316;margin-bottom:12px}
#eyebrow{font-size:24px;font-weight:700;letter-spacing:4px;color:#F97316}
#title{font-size:64px;font-weight:800;line-height:1.1;color:#fff;margin:4px 0 0}
#sub{font-size:26px;line-height:1.35;color:#D2DCEE;margin:8px 0 0;max-width:1360px;min-height:35px}
#bandR{display:flex;align-items:center;gap:36px}
#msw{display:flex;border:3px solid #5A7DB5;border-radius:999px;overflow:hidden}
#msw button{font:700 26px Arial,Helvetica,sans-serif;padding:10px 26px;border:0;background:transparent;color:#D2DCEE;cursor:pointer}
#msw button.on{background:#F97316;color:#14284B}
.badge{background:#fff;border-radius:20px;padding:22px 30px;display:flex;align-items:center}
.badge img{width:300px;height:auto;display:block}
#tabs{height:112px;display:flex;align-items:center;gap:16px;padding:0 96px;box-sizing:border-box}
.tab{font:700 30px Arial,Helvetica,sans-serif;padding:16px 34px;border-radius:999px;border:3px solid #1B3A6B;background:#fff;color:#1B3A6B;cursor:pointer}
.tab:hover{background:#E8EDF5}
.tab.on{background:#1B3A6B;color:#fff}
#content{position:absolute;left:96px;right:96px;top:344px;height:620px}
#footer{position:absolute;left:0;right:0;bottom:0;height:104px;background:#fff;border-top:2px solid #DDE3EE;display:flex;align-items:center;justify-content:space-between;padding:0 96px;box-sizing:border-box}
.nb{font:700 30px Arial,Helvetica,sans-serif;padding:16px 38px;border-radius:14px;border:3px solid #1B3A6B;background:#1B3A6B;color:#fff;cursor:pointer}
.nb.ghost{background:#fff;color:#1B3A6B}
.nb:disabled{opacity:.35;cursor:default}
#mid{display:flex;align-items:center;gap:28px;font-size:26px;color:#4A5568}
#dots{display:flex;gap:10px}
#dots i{width:64px;height:12px;border-radius:6px;background:#DDE3EE;display:block;overflow:hidden}
#dots i b{display:block;height:100%;background:#F97316;width:0}
.tg{font:500 26px Arial,Helvetica,sans-serif;padding:12px 22px;border-radius:12px;border:2px solid #C9D3E6;background:#fff;color:#14284B;cursor:pointer;margin-left:12px}
.tg.on{background:#FFF1E6;border-color:#F97316;color:#B94A05}
#notes{position:absolute;left:96px;right:96px;bottom:128px;background:#14284B;color:#fff;border-radius:20px;padding:26px 34px;font-size:28px;line-height:1.4;display:none;box-shadow:0 0 0 4px #F97316}
#notes small{display:block;font-size:22px;letter-spacing:3px;color:#F97316;font-weight:700;margin-bottom:8px}
svg text{font-family:Arial,Helvetica,sans-serif}
.ct{transition:opacity .25s;cursor:pointer}
.panel{display:flex;gap:28px;margin-top:14px}
.dcard{flex:1;background:#fff;border:2px solid #DDE3EE;border-radius:18px;padding:22px 28px;box-sizing:border-box}
.dcard h3{font-size:40px;margin:0;color:#1B3A6B;line-height:1.1}
.dcard .ds{font-size:26px;color:#4A5568;margin:6px 0 12px}
.dcard .st{font-size:30px;font-weight:500;line-height:1.4;color:#14284B}
.dcard .ex{font-size:26px;line-height:1.35;color:#4A5568;margin-top:10px}
.hint{font-size:30px;color:#4A5568;line-height:1.4;background:#fff;border:2px dashed #C9D3E6;border-radius:18px;padding:26px 32px;margin-top:14px}
.dgrid{display:grid;gap:24px}
.doc{background:#fff;border:2px solid #DDE3EE;border-top:10px solid #1B3A6B;border-radius:18px;padding:24px 28px}
.doc.o{border-top-color:#F97316}
.doc h4{font-size:38px;margin:0 0 10px;color:#14284B;line-height:1.15}
.doc p{font-size:28px;line-height:1.4;color:#4A5568;margin:0}
.ph{font-size:40px;font-weight:700;color:#1B3A6B;margin:0 0 16px;display:flex;gap:16px;align-items:baseline}
.ph span{color:#F97316}
.ph.o{color:#B94A05}
.rwrap{display:flex;align-items:center}
.fbox{width:380px;background:#FFF1E6;border:4px solid #F97316;border-radius:20px;padding:32px;text-align:center;box-sizing:border-box}
.fbox h3{font-size:50px;margin:0;color:#1B3A6B;line-height:1.1}
.fbox p{font-size:28px;margin:12px 0 0;color:#4A5568}
.conn{width:56px;height:4px;background:#F8C79A}
.rlist{flex:1;display:flex;flex-direction:column;gap:14px;border-left:4px solid #F8C79A}
.r{display:flex;align-items:stretch}
.r .a{width:72px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:#B94A05}
.r .c{flex:1;display:flex;justify-content:space-between;align-items:center;gap:24px;background:#fff;border:2px solid #DDE3EE;border-radius:16px;padding:16px 32px;transition:opacity .25s,background .25s;height:84px;box-sizing:border-box}
.r .c h3{font-size:38px;margin:0;color:#1B3A6B}
.r .c p{font-size:28px;margin:0;color:#4A5568;text-align:right}
.r.hl .c{background:#FFF1E6;border:3px solid #F97316}
.r.nd .c{background:#E8EDF5;border:3px solid #1B3A6B}
.r.du .c{background:#FFF1E6;border:4px solid #F97316}
.r.du .c p{color:#B94A05;font-weight:700}
.dim{opacity:.28}
.pills{display:flex;gap:16px;margin-top:22px}
.pill{background:#fff;border:2px solid #DDE3EE;border-radius:999px;padding:14px 26px;font-size:26px;color:#14284B;transition:all .25s}
.pill.hi{background:#FFF1E6;border-color:#F97316;font-weight:700}
.leg{display:flex;gap:18px;margin-top:22px}
.leg span{padding:12px 24px;border-radius:999px;font-size:26px;font-weight:700}
body.notabs #tabs,body.notabs .tg,body.notabs #msw{display:none}
body.notabs #content{top:240px;height:736px;display:flex;flex-direction:column;justify-content:center}
.dcols{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:stretch}
.dcol{background:#fff;border:2px solid #DDE3EE;border-top:10px solid #1B3A6B;border-radius:18px;overflow:hidden}
.dcol.o{border-top-color:#F97316}
.dh{display:flex;align-items:center;gap:16px;font-size:34px;font-weight:800;color:#1B3A6B;padding:22px 32px;border-bottom:2px solid #DDE3EE;line-height:1.15}
.dcol.o .dh{color:#B94A05}
.dh span{font-size:20px;font-weight:700;letter-spacing:3px;background:#E8EDF5;color:#1B3A6B;border-radius:999px;padding:6px 16px}
.dcol.o .dh span{background:#FFF1E6;color:#B94A05}
.drow{padding:18px 32px;border-bottom:2px solid #EEF1F7}
.drow:last-child{border-bottom:0}
.drow h4{font-size:30px;margin:0 0 4px;color:#14284B;line-height:1.2}
.drow p{font-size:23px;line-height:1.35;color:#4A5568;margin:0}
#xbtn{display:none;position:absolute;right:20px;top:93px;width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff;font:400 40px/1 Arial,Helvetica,sans-serif;cursor:pointer;padding:0;z-index:5}
#xbtn:hover{background:#F97316;border-color:#F97316}
body.emb #xbtn{display:block}
</style>
</head>

  g+='<g class="ct" data-c="'+i+'" style="opacity:'+(on?1:.28)+'"><rect x="'+(c-76)+'" y="200" width="152" height="90" rx="8" fill="'+(inz?'#F97316':'#1B3A6B')+'"/>';
  [14,28,124,138].forEach(function(o){g+='<line x1="'+(c-76+o)+'" y1="208" x2="'+(c-76+o)+'" y2="282" stroke="#fff" stroke-opacity=".45" stroke-width="4"/>'});
  g+='<text x="'+c+'" y="260" text-anchor="middle" font-size="44" font-weight="700" fill="'+(inz?'#14284B':'#fff')+'">'+(i+1)+'</text>';
  d.steps[i].forEach(function(l,j){g+='<text x="'+c+'" y="'+(334+j*36)+'" text-anchor="middle" font-size="28" fill="#14284B">'+esc(l)+'</text>'});
  g+='</g>';}
 var ml=Math.max.apply(null,d.steps.map(function(x){return x.length})),bot=334+(ml-1)*36+6,vh=bot-8;
 var svg='<svg viewBox="0 8 '+w+' '+vh+'" width="'+w+'" height="'+vh+'" role="img" aria-label="Seven containers showing the steps of the flow">'+g+'</svg>';
 var panel;
 if(!CFG.tabs){panel=''}
 else if(st.all){panel='<div class="panel">'+d.stages.map(function(s){return '<div class="dcard" style="padding:16px 20px"><h3 style="font-size:32px">'+esc(s.t)+'</h3><div class="ds" style="font-size:22px;margin:4px 0 8px">'+esc(s.s)+'</div><div class="st" style="font-size:24px">'+s.st.map(esc).join('<br>')+'</div></div>'}).join('')+'</div>'}
 else if(!sel){panel='<div class="hint">'+esc(d.hint)+'</div>'}
 else{panel='<div class="panel"><div class="dcard"><h3>'+esc(sel.t)+'</h3><div class="ds">'+esc(sel.s)+'</div><div class="st">'+sel.st.map(esc).join('<br>')+'</div>'+(sel.ex?'<div class="ex">'+esc(sel.ex)+'</div>':'')+'</div></div>'}
 $('content').innerHTML=svg+panel;
}
function docCards(p,o){var n=p.d.length;return '<div class="dgrid" style="grid-template-columns:repeat('+n+',1fr)">'+p.d.map(function(x){return '<div class="doc'+(o?' o':'')+'"><h4>'+esc(x[0])+'</h4><p>'+esc(x[1])+'</p></div>'}).join('')+'</div>'}
function rDocs(d){
 if(st.all){$('content').innerHTML='<div class="dcols">'+d.ph.map(function(p,i){return '<div class="dcol'+(i?' o':'')+'"><div class="dh"><span>'+(i?'OUT':'IN')+'</span>'+esc(p.t)+'</div>'+p.d.map(function(x){return '<div class="drow"><h4>'+esc(x[0])+'</h4><p>'+esc(x[1])+'</p></div>'}).join('')+'</div>'}).join('')+'</div>';return}
 var p=d.ph[st.t];$('content').innerHTML='<div class="ph'+(st.t?' o':'')+'"><span>0'+(st.t+1)+'</span>'+esc(p.t)+'</div>'+docCards(p,st.t==1);
}
function rRoutes(d){
 var tab=st.all?3:st.t;
 var n=d.r.length,h=n*84+(n-1)*14;
 var rows=d.r.map(function(r){
  var cls='r';if(tab==0||tab==3){if(r[2]=='hl')cls+=' hl'}
  else if(tab==1){if(r[2]=='nd')cls+=' nd';else if(r[2]=='du')cls+=' du'}
  else if(tab==2){cls+=' dim'}
  if(tab==3){if(r[2]=='nd')cls+=' nd';else if(r[2]=='du')cls+=' du';else if(r[2]=='hl')cls+=' hl'}
  return '<div class="'+cls+'"><div class="a">→</div><div class="c"><h3>'+esc(r[0])+'</h3><p>'+esc(r[1])+'</p></div></div>'}).join('');
 var top=Math.round((h-300)/2);
 var html='<div class="rwrap" style="height:'+h+'px"><div class="fbox" style="margin-top:0"><h3>Astromar FTWZ</h3><p>Stock held in the zone</p></div><div class="conn"></div><div class="rlist">'+rows+'</div></div>';
 var bottom;
 if(tab==1){bottom='<div class="leg"><span style="background:#1B3A6B;color:#fff">Navy: no customs duty</span><span style="background:#F97316;color:#14284B">Orange: customs duty, paid by the buyer</span></div>'}
 else{bottom='<div class="pills">'+d.also.map(function(p){return '<div class="pill'+(tab==2||tab==3&&false?' hi':'')+'">'+esc(p)+'</div>'}).join('')+'</div>'}
 $('content').innerHTML=html+bottom;
}
function go(dir){st.all=false;if(dir>0){if(st.s<2){st.s++;st.t=0}}else{if(st.s>0){st.s--;st.t=0}}render()}
function fit(){var de=document.documentElement,W=de.clientWidth||innerWidth||1920,H=de.clientHeight||innerHeight||1080;var s=Math.min(W/1920,H/1080);$('stage').style.transform='translate('+((W-1920*s)/2)+'px,'+((H-1080*s)/2)+'px) scale('+s+')'}
function fromHash(){var h=location.hash.replace('#','').split('-');if(h.length==2){var m=h[0].toUpperCase(),i=SL.indexOf(h[1]);if(D[m]&&i>=0){st.m=m;st.s=i;st.t=0}}}
document.addEventListener('click',function(e){
 var t=e.target;
 var tab=t.closest&&t.closest('.tab');if(tab){st.t=+tab.getAttribute('data-i');st.all=false;render();return}
 var mb=t.closest&&t.closest('#msw button');if(mb){st.m=mb.getAttribute('data-m');st.t=0;render();return}
 var ct=t.closest&&t.closest('[data-c]');if(CFG.tabs&&ct&&st.s==0){var ci=+ct.getAttribute('data-c'),d=D[st.m].flow;for(var k=0;k<d.stages.length;k++){if(d.stages[k].idx.indexOf(ci)>=0){st.t=k+1;st.all=false;render();return}}}
});
$('prev').onclick=function(){go(-1)};$('next').onclick=function(){go(1)};
$('tgAll').onclick=function(){st.all=!st.all;render()};
$('tgNotes').onclick=function(){st.notes=!st.notes;render()};
$('tgFs').onclick=function(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}catch(e){}};
document.addEventListener('keydown',function(e){
 var k=e.key;
 if(k=='ArrowRight'||k=='ArrowDown'||k==' '||k=='PageDown'||k=='Enter'){e.preventDefault();go(1)}
 else if(k=='ArrowLeft'||k=='ArrowUp'||k=='PageUp'||k=='Backspace'){e.preventDefault();go(-1)}
 else if(k=='1'||k=='2'||k=='3'){st.s=+k-1;st.t=0;st.all=false;render()}
 else if((k=='a'||k=='A')&&CFG.tabs){st.all=!st.all;render()}
 else if(k=='n'||k=='N'){st.notes=!st.notes;render()}
 else if(k=='f'||k=='F'){$('tgFs').onclick()}
});
window.addEventListener('resize',fit);window.addEventListener('load',fit);setTimeout(fit,150);setTimeout(fit,800);try{new ResizeObserver(fit).observe(document.documentElement)}catch(e){}
window.addEventListener('hashchange',function(){fromHash();render()});
fromHash();fit();render();
})();
</script>
</body>
</html>
